services:
  mysql:
    image: mysql:8.4
    container_name: tripsync-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tripsync_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - tripsync-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL" ,"mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tripsync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tripsync-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripsync-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
      DB_URL: "jdbc:mysql://mysql:3306/tripsync_db"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ""
      REDIS_SSL_ENABLED: "false"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  tripsync-mysql-data:
  tripsync-redis-data: